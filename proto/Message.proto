syntax = "proto3";

package qmsrchat;

// Phase 6: Schema 治理说明
// - 删除字段时必须添加 reserved 声明（reserved 字段号或名称），防止字段号被复用
// - 语义必填字段标注 [required]，可选字段标注 [optional]
// - schema_version 用于向前/向后兼容校验，当前版本 = 1

message RegisterReq {
    string user = 1;        // [required] 用户名
    string email = 2;       // [required] 邮箱
    string passwd = 3;      // [required] 密码哈希
    string verify_code = 4; // [required] 验证码
    NonceHeader nonce_header = 5; // [optional] Phase 6.4: 防重放
}

message RegisterRsp {
    int32 error = 1;
    string email = 2;
}

message ChatLoginReq {
    int32 uid = 1;     // [required] 用户 ID
    string token = 2;  // [required] 登录令牌
}

message ChatLoginRsp {
    int32 error = 1;
    string message = 2;
}

message ChatTextMsg {
    int32 from_uid = 1;           // [required] 发送方 UID
    int32 to_uid = 2;             // [required] 接收方 UID
    string content = 3;           // [required] 消息内容
    string client_msg_id = 4;     // [required] 客户端消息 ID（去重）
    int64 timestamp = 5;          // [required] 客户端毫秒时间戳
    NonceHeader nonce_header = 6; // [optional] Phase 5E: 防重放
    int32 schema_version = 7;     // [optional] Phase 6: schema 版本号（默认 0 = v1）
}

message NonceHeader {
    string nonce = 1;     // [required] UUID v4 字符串，客户端生成
    int64  timestamp = 2; // [required] 毫秒级时间戳
    string signature = 3; // [optional] HMAC-SHA256 签名（防篡改）
}

message ChatAck {
    int32 error = 1;
    string message = 2;
    string client_msg_id = 3;
}

message ServerChatMsg {
    int32 from_uid = 1;        // [required] 发送方 UID
    string content = 2;        // [required] 消息内容
    string client_msg_id = 3;  // [required] 客户端消息 ID
    int64 server_msg_id = 4;   // [required] 服务端消息 ID
    int32 to_uid = 5;          // [required] 接收方 UID
    int64 timestamp = 6;       // [required] 时间戳
    int32 schema_version = 7;  // [optional] Phase 6: schema 版本号
}

message VerifyCodeReq {
    string email = 1;
}

message VerifyCodeRsp {
    int32 error = 1;
    string email = 2;
}

message ResetPwdReq {
    string user = 1;
    string email = 2;
    string passwd = 3;
    string verify_code = 4;
    NonceHeader nonce_header = 5; // [optional] Phase 6.4: 防重放
}

message ResetPwdRsp {
    int32 error = 1;
}

message FileReq {
    int64 task_id = 1;
    int32 from_uid = 2;
    int32 to_uid = 3;
    string filename = 4;
    int64 total_size = 5;
    string md5 = 6;
    int64 offset = 7;
}

message FileRsp {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
    int64 offset = 4;
}

message FileChunk {
    int64 task_id = 1;
    int64 offset = 2;
    int64 size = 3;
    bytes data = 4;
}

message FileAck {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
    int64 received = 4;
}

// === 图片消息 + 撤回 + 编辑（新增 1009-1014）===
message ImageMsg {
    int32  from_uid  = 1;   // [required] 发送方 UID
    int32  to_uid    = 2;   // [required] 接收方 UID
    string image_id  = 3;   // [required] 图片唯一标识
    string caption   = 4;   // [optional] 图片说明文字
    int64  timestamp = 5;   // [required] 时间戳
    int32  width     = 6;   // [required] 图片宽度
    int32  height    = 7;   // [required] 图片高度
    string ext       = 8;   // [required] 文件扩展名
    int64  size      = 9;   // [required] 文件大小（字节）
    string md5       = 10;  // [optional] 文件 MD5
    int32  schema_version = 11; // [optional] Phase 6: schema 版本号
}

message ImageDownloadReq { string image_id = 1; }

message ImageDownloadRsp {
    int32  error    = 1;
    string image_id = 2;
    int64  offset   = 3;
}

message RecallMsg {
    int32  from_uid      = 1;
    int64  msg_timestamp = 2;
    string client_msg_id = 3;
    NonceHeader nonce_header = 4;  // Phase 5E: 防重放
}

message RecallNotify {
    int64  msg_timestamp = 1;
    int32  recall_uid    = 2;
    int32  recalled_to   = 3;
    int64  recall_ts     = 4;
}

message EditMsg {
    int32  from_uid      = 1; // [required] 编辑者 UID
    int64  msg_timestamp = 2; // [required] 被编辑消息时间戳
    string new_content   = 3; // [required] 编辑后内容（服务端限制 ≤2000 字符）
    NonceHeader nonce_header = 4; // [optional] Phase 5E: 防重放
}

message EditNotify {
    int64  msg_timestamp = 1;
    int32  from_uid      = 2;
    string new_content   = 3;
    int64  edit_ts       = 4;
}

message EditAck {
    int32  error         = 1;
    string message       = 2;
    int64  msg_timestamp = 3;
    int64  edit_ts       = 4;
    string new_content   = 5;  // 编辑成功时回传新内容，供发送方本地更新UI
}

// ─── Phase 5C: 统一错误码定义（顶层枚举，ERR_ 前缀避免命名冲突）───
enum ErrorCode {
    ERR_SUCCESS              = 0;
    ERR_NETWORK              = 2;
    ERR_PARSE_ERROR          = 1001;  // JSON/Protobuf 解析失败
    ERR_INVALID_PARAM        = 1002;  // 参数校验失败
    ERR_VERIFY_EXPIRED       = 1003;
    ERR_VERIFY_WRONG         = 1004;
    ERR_USER_EXIST           = 1005;
    ERR_PASSWD_ERR           = 1006;
    ERR_USER_NOT_EXIST       = 1007;
    ERR_EMAIL_NOT_MATCH      = 1008;
    ERR_PASSWD_UPDATE        = 1009;
    ERR_RPC_FAILED           = 1010;
    ERR_DB_ERROR             = 1011;
    ERR_KICKED               = 1013;  // 被另一设备登录踢出
    ERR_BUSY                 = 1014;  // 服务器繁忙（队列满/连接数超限/限流）
    ERR_RATE_LIMITED         = 1015;  // 消息发送频率超限
    ERR_RECALL_TIMEOUT       = 4001;  // 超过 2 分钟无法撤回
    ERR_RECALL_NOT_OWNER     = 4002;  // 非本人消息无法撤回
    ERR_EDIT_TIMEOUT         = 4003;  // 超过 2 分钟无法编辑
    ERR_EDIT_NOT_OWNER       = 4004;  // 非本人消息无法编辑
    ERR_EDIT_TOO_LONG        = 4005;  // 编辑内容超长
    ERR_MSG_ALREADY_RECALLED = 4006;  // 目标消息已撤回
    ERR_IMAGE_EXPIRED        = 4040;  // 图片 7 天过期
}

// ─── Phase 5C: 消息类型 ID 定义（MSG_ID_ 前缀避免与 ErrorCode 冲突）───
enum MsgType {
    MSG_ID_UNKNOWN = 0;       // proto3 要求首位为 0
    MSG_ID_HELLO              = 1000;
    MSG_ID_GET_VERIFY_CODE    = 1001;
    MSG_ID_REGISTER_USER      = 1002;
    MSG_ID_RESET_PWD          = 1003;
    MSG_ID_LOGIN_USER         = 1004;
    MSG_ID_CHAT_LOGIN         = 1005;
    MSG_ID_CHAT_TEXT          = 1006;
    MSG_ID_CHAT_ACK           = 1007;
    MSG_ID_OFFLINE_ACK        = 1008;
    MSG_ID_CHAT_IMAGE         = 1009;
    MSG_ID_IMAGE_DOWNLOAD_RSP = 1010;
    MSG_ID_CHAT_RECALL        = 1011;
    MSG_ID_CHAT_EDIT          = 1012;
    MSG_ID_IMAGE_DOWNLOAD_REQ = 1013;
    MSG_ID_CHAT_RECALL_NOTIFY = 1014;
    MSG_ID_CHAT_EDIT_NOTIFY   = 1015;
    MSG_ID_FILE_REQ           = 2001;
    MSG_ID_FILE_RSP           = 2002;
    MSG_ID_FILE_CHUNK         = 2003;
    MSG_ID_FILE_ACK           = 2004;
}
