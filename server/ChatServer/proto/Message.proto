syntax = "proto3";

package qmsrchat;

message LoginReq {
    string user = 1;
    string passwd = 2;
}

message LoginRsp {
    int32 error = 1;
    int32 uid = 2;
    string token = 3;
    string user = 4;
}

message RegisterReq {
    string user = 1;
    string email = 2;
    string passwd = 3;
    string verify_code = 4;
}

message RegisterRsp {
    int32 error = 1;
    string email = 2;
}

message ChatLoginReq {
    int32 uid = 1;
    string token = 2;
}

message ChatLoginRsp {
    int32 error = 1;
    string message = 2;
}

message ChatTextMsg {
    int32 from_uid = 1;
    int32 to_uid = 2;
    string content = 3;
    string client_msg_id = 4;
}

message ChatAck {
    int32 error = 1;
    string message = 2;
    string client_msg_id = 3;
}

message ServerChatMsg {
    int32 from_uid = 1;
    string content = 2;
    string client_msg_id = 3;
    int64 server_msg_id = 4;
    int32 to_uid = 5;
    int64 timestamp = 6;
}

message OfflineAck {
    int64 received = 1;
    int64 total = 2;
}

message VerifyCodeReq {
    string email = 1;
}

message VerifyCodeRsp {
    int32 error = 1;
    string email = 2;
}

message ResetPwdReq {
    string user = 1;
    string email = 2;
    string passwd = 3;
    string verify_code = 4;
}

message ResetPwdRsp {
    int32 error = 1;
}

message FileReq {
    int64 task_id = 1;
    int32 to_uid = 2;
    string filename = 3;
    int64 total_size = 4;
}

message FileRsp {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
    int64 offset = 4;
}

message FileChunk {
    int64 task_id = 1;
    int64 offset = 2;
    int64 size = 3;
    bytes data = 4;
}

message FileAck {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
    int64 received = 4;
}

message ZeroCopyStart {
    int64 task_id = 1;
    int32 to_uid = 2;
    string filename = 3;
    int64 total_size = 4;
}

message ZeroCopyReady {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
}

message ZeroCopyData {
    int64 task_id = 1;
    int64 offset = 2;
    int64 size = 3;
}

message ZeroCopyComplete {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
}

message ZeroCopyError {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
}
