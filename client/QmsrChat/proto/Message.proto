syntax = "proto3";

package qmsrchat;

message RegisterReq {
    string user = 1;
    string email = 2;
    string passwd = 3;
    string verify_code = 4;
}

message RegisterRsp {
    int32 error = 1;
    string email = 2;
}

message ChatLoginReq {
    int32 uid = 1;
    string token = 2;
}

message ChatLoginRsp {
    int32 error = 1;
    string message = 2;
}

message ChatTextMsg {
    int32 from_uid = 1;
    int32 to_uid = 2;
    string content = 3;
    string client_msg_id = 4;
    int64 timestamp = 5;  // 客户端毫秒时间戳，服务端存入DB用于撤回/编辑查找
}

message ChatAck {
    int32 error = 1;
    string message = 2;
    string client_msg_id = 3;
}

message ServerChatMsg {
    int32 from_uid = 1;
    string content = 2;
    string client_msg_id = 3;
    int64 server_msg_id = 4;
    int32 to_uid = 5;
    int64 timestamp = 6;
}

message VerifyCodeReq {
    string email = 1;
}

message VerifyCodeRsp {
    int32 error = 1;
    string email = 2;
}

message ResetPwdReq {
    string user = 1;
    string email = 2;
    string passwd = 3;
    string verify_code = 4;
}

message ResetPwdRsp {
    int32 error = 1;
}

message FileReq {
    int64 task_id = 1;
    int32 from_uid = 2;
    int32 to_uid = 3;
    string filename = 4;
    int64 total_size = 5;
    string md5 = 6;
    int64 offset = 7;
}

message FileRsp {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
    int64 offset = 4;
}

message FileChunk {
    int64 task_id = 1;
    int64 offset = 2;
    int64 size = 3;
    bytes data = 4;
}

message FileAck {
    int64 task_id = 1;
    int32 error = 2;
    string message = 3;
    int64 received = 4;
}

// === 图片消息 + 撤回 + 编辑（新增 1009-1014）===
message ImageMsg {
    int32  from_uid  = 1;
    int32  to_uid    = 2;
    string image_id  = 3;
    string caption   = 4;
    int64  timestamp = 5;
    int32  width     = 6;
    int32  height    = 7;
    string ext       = 8;
    int64  size      = 9;
    string md5       = 10;
}

message ImageDownloadReq { string image_id = 1; }

message ImageDownloadRsp {
    int32  error    = 1;
    string image_id = 2;
    int64  offset   = 3;
}

message RecallMsg {
    int32  from_uid      = 1;
    int64  msg_timestamp = 2;
    string client_msg_id = 3;
}

message RecallNotify {
    int64  msg_timestamp = 1;
    int32  recall_uid    = 2;
    int32  recalled_to   = 3;
    int64  recall_ts     = 4;
}

message EditMsg {
    int32  from_uid      = 1;
    int64  msg_timestamp = 2;
    string new_content   = 3;
}

message EditNotify {
    int64  msg_timestamp = 1;
    int32  from_uid      = 2;
    string new_content   = 3;
    int64  edit_ts       = 4;
}

message EditAck {
    int32  error         = 1;
    string message       = 2;
    int64  msg_timestamp = 3;
    int64  edit_ts       = 4;
    string new_content   = 5;  // 编辑成功时回传新内容，供发送方本地更新UI
}
